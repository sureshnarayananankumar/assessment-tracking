# =====================================================================
# AssessHub - Docker Compose
#
#   1) Fully containerised (MySQL + MailHog in Docker):
#        COMPOSE_PROFILES=local-db,local-mail   (set in .env)
#        docker compose up -d --build
#
#   2) Existing MySQL Server managed with MySQL Workbench:
#        COMPOSE_PROFILES=            (or local-mail only)
#        DB_HOST=host.docker.internal (MySQL on this machine) or the server's host name
#        docker compose up -d --build
#
# All secrets come from .env (never commit it). See .env.example.
# =====================================================================
name: assesshub

services:
  mysql:
    image: mysql:8.4
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-assesshub}
      MYSQL_USER: ${DB_USERNAME:-assesshub_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      # Bound to localhost only: connect MySQL Workbench to 127.0.0.1:${MYSQL_HOST_PORT}
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  mailhog:
    # Development SMTP sink: every e-mail is captured and viewable at http://localhost:${MAILHOG_UI_PORT}
    image: mailhog/mailhog:v1.0.1
    profiles: ["local-mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_UI_PORT:-8026}:8025"

  backend:
    build:
      context: ./backend
    image: assesshub-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      mailhog:
        condition: service_started
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-assesshub}
      DB_USERNAME: ${DB_USERNAME:-assesshub_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_PARAMS: ${DB_PARAMS:-sslMode=PREFERRED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=UTF-8}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090,http://localhost:5174}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@assesshub.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Business Gateways International}
      MAIL_LOG_LINKS: ${MAIL_LOG_LINKS:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Super Admin}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      UPLOAD_DIR: /app/data/uploads
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC}
    ports:
      # Exposed on localhost for Swagger/debugging only; browsers use the frontend's /api proxy.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - uploads:/app/data/uploads
    extra_hosts:
      # Lets DB_HOST=host.docker.internal reach a MySQL Server running on the Docker host (Linux too).
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
    image: assesshub-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "${FRONTEND_HOST_PORT:-8090}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  uploads:
