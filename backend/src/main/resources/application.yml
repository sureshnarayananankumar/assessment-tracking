# =====================================================================
# AssessHub backend configuration.
# Every secret / environment-specific value comes from an environment
# variable. Nothing sensitive is hardcoded here. See ../.env.example.
# =====================================================================
server:
  port: ${SERVER_PORT:8080}
  # Trust X-Forwarded-* only from internal proxies (nginx in Docker, private ranges).
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: assesshub-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:assesshub}?${DB_PARAMS:sslMode=PREFERRED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:assesshub_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      pool-name: assesshub-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: AssessHub
    version: 1.0.0

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    com.assesshub: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    # preferred_instant_jdbc_type is intentional (Instant -> DATETIME(6) in UTC); hide the "incubating" notice
    org.hibernate.orm.incubating: ERROR

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:8090}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: assesshub
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@assesshub.local}
    from-name: ${MAIL_FROM_NAME:AssessHub}
    # Development only: also write invitation/reset links to the log. Never enable in production.
    log-links: ${MAIL_LOG_LINKS:false}
  security:
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:60}
    account-setup-hours: ${ACCOUNT_SETUP_HOURS:72}
    rate-limit:
      auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    allowed-extensions: pdf,doc,docx,txt,md,zip,png,jpg,jpeg,gif,csv,xlsx,json,java,js,ts,tsx,jsx,py,sql,html,css
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Super Admin}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
    password: ${DEMO_USER_PASSWORD:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    expiry-check-ms: ${EXPIRY_CHECK_MS:15000}
    maintenance-ms: ${MAINTENANCE_MS:60000}
