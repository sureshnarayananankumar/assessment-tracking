spring:
  datasource:
    url: jdbc:h2:mem:assesshub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,KEY;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  frontend-url: http://localhost:5174
  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256-0123456789
  mail:
    enabled: false
  scheduler:
    enabled: false
  storage:
    upload-dir: ${java.io.tmpdir}/assesshub-test-uploads
  security:
    rate-limit:
      auth-requests-per-minute: 10000
  bootstrap:
    admin-email: admin@test.local
    admin-password: AdminPass123
    admin-name: Test Admin

logging:
  level:
    com.assesshub: WARN
    org.hibernate: WARN
